name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-build:
    runs-on: ubuntu-latest
    container:
      image: jamieleecho/coco-dev:latest
    steps:
      - uses: actions/checkout@master

      - name: Check compile
        run: |
          make

      # `make` above clones/builds cmoc_os9 and installs MVKit, so the guide
      # examples (which use mvkit/app.mk) can build against it.
      - name: Build guide examples
        run: |
          make -C examples/guide/01-hello
