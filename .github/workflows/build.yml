name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-build:
    runs-on: ubuntu-latest
    container:
      image: jamieleecho/coco-dev:latest
    steps:
      - uses: actions/checkout@master

      - name: Check compile
        run: |
          make

      # `make` above clones/builds cmoc_os9 and installs MVKit; mvkit-guide then
      # builds every mvkit/guide/NN-* app via mvkit/app.mk.
      - name: Build guide examples
        run: |
          make mvkit-guide

  # Language-agnostic hooks (.pre-commit-config.yaml); runs on a plain Python
  # runner, independent of the coco-dev toolchain.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1
